function startWorkout(name,ids){
  if(S.session){toast('Finish or discard your current workout first');S.sessionOpen=true;renderSession();return}
  S.session={name,start:Date.now(),ex:ids.filter(id=>EXM[id]).map(id=>({id,sets:defaultSets(id)}))};
  S.sessionOpen=true;saveDraft();closeModal();renderSession();renderMini();
}
function renderMini(){
  const m=$('#mini');if(!S.session||S.sessionOpen){m.hidden=true;return}
  m.hidden=false;m.innerHTML=`<span class="pulse"></span><div class="mt"><b>${esc(S.session.name)}</b><small id="miniClock">${clock((Date.now()-S.session.start)/1000)} · ${S.session.ex.length} exercises</small></div><button class="btn sm primary" data-act="resume">Open</button>`;
}
function renderSession(){
  const root=$('#session');
  if(!S.session||!S.sessionOpen){root.classList.remove('open');root.innerHTML='';document.body.style.overflow='';renderMini();renderRest();return}
  document.body.style.overflow='hidden';root.classList.add('open');renderMini();
  const s=S.session;
  root.innerHTML=`<div class="sess-h"><button class="icon-btn" data-act="minimize" aria-label="Minimize">${I('down')}</button>
    <div class="mid"><input class="sess-name" id="sessName" value="${esc(s.name)}" maxlength="40" aria-label="Workout name"><div class="sess-clock">${I('clock')}<span id="sessClock">${clock((Date.now()-s.start)/1000)}</span></div></div>
    <button class="btn primary" data-act="finish">Finish</button></div>
    <div class="sess-b" id="sessBody"><div class="sess-in">${s.ex.map(exCard).join('')}
      ${s.ex.length?'':`<div class="card empty"><div class="bigic">${I('train')}</div><h3>Empty workout</h3><p class="t2">Add your first exercise to get going.</p></div>`}
      <button class="btn primary block" data-act="add-ex" style="height:50px">${I('plus')}Add exercises</button>
      <button class="btn block danger" data-act="discard">Discard workout</button></div></div>`;
  renderRest();
}
function exCard(e,ei){
  const ex=EXM[e.id]||{id:e.id,n:e.id,m:'Chest',eq:'',k:'weight'};
  const prev=lastPerf(e.id)||[];const k=ex.k;
  const cols=k==='weight'?[U(),'Reps']:k==='bw'?['+'+U(),'Reps']:k==='hold'?['','Sec']:['Km','Min'];
  return`<div class="card ex-card"><div class="ex-h"><div class="mb">${MABBR[ex.m]||'EX'}</div><div class="info"><b><button data-act="open-ex" data-id="${ex.id}">${esc(ex.n)}</button></b><small class="muted">${ex.m} · ${esc(ex.eq)}</small></div>
    <button class="icon-btn" data-act="rm-ex" data-ei="${ei}" aria-label="Remove exercise">${I('trash')}</button></div>
    <div class="srow head"><span>Set</span><span>Previous</span><span>${cols[0]}</span><span>${cols[1]}</span><span></span></div>
    ${e.sets.map((s,si)=>{const p=prev[si];const pw=p?(k==='cardio'?fmtN(p.w||0):p.w?fmtW(p.w):''):'';const pr=p?String(p.r||''):'';
      const wv=s.w==null?'':(k==='cardio'?fmtN(s.w):fmtW(s.w));const rv=s.r==null?'':s.r;
      return`<div class="srow ${s.done?'done':''}" data-ei="${ei}" data-si="${si}"><span class="sn">${si+1}</span><span class="prev">${p?setLabel(k,p):'—'}</span>
      ${k==='hold'?'<span class="blank">—</span>':`<input inputmode="decimal" data-f="w" value="${wv}" placeholder="${pw||'0'}" aria-label="${cols[0]} set ${si+1}">`}
      <input inputmode="numeric" data-f="r" value="${rv}" placeholder="${pr||'0'}" aria-label="${cols[1]} set ${si+1}">
      <button class="chk" data-act="toggle-set" aria-label="Complete set ${si+1}">${I('check')}</button></div>`}).join('')}
    <div class="ex-actions"><button class="btn sm" data-act="add-set" data-ei="${ei}">${I('plus')}Add set</button>${e.sets.length>1?`<button class="btn sm" data-act="rm-set" data-ei="${ei}">${I('minus')}Remove set</button>`:''}</div></div>`;
}
function rerenderSessionBody(){const b=$('#sessBody');const st=b?b.scrollTop:0;renderSession();const nb=$('#sessBody');if(nb)nb.scrollTop=st}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sessName'&&S.session){S.session.name=t.value;saveDraft();return}
  const row=t.closest('.srow');if(row&&S.session&&t.dataset.f){const ex=S.session.ex[+row.dataset.ei];const s=ex.sets[+row.dataset.si];const k=EXM[ex.id].k;
    const v=parseFloat(t.value.replace(',','.'));
    if(t.dataset.f==='w')s.w=isNaN(v)?null:(k==='cardio'?v:fromD(v));else s.r=isNaN(v)?null:Math.round(v);saveDraft();return}
  const inp=t.dataset.inp;
  if(inp==='lib-q'){LIB.q=t.value;$('#libgrid').innerHTML=libGrid()}
  if(inp==='pk-q'&&PK){PK.q=t.value;renderPicker()}
});

let audioCtx=null;
function beep(){try{if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.2,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.25);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.26)}catch(e){}}
function startRest(sec){if(!sec)return;S.restTotal=sec;S.restEnd=Date.now()+sec*1000;renderRest()}
function renderRest(){
  const r=$('#rest');if(!S.session||!S.restEnd){r.classList.remove('show');return}
  const left=Math.max(0,(S.restEnd-Date.now())/1000);
  if(!r.classList.contains('show')||!$('#restT')){
    r.classList.add('show');
    r.innerHTML=`<div class="rt" id="restT"></div><div class="rl"><b>Rest</b><span>Next set when timer ends</span></div><button class="btn sm" data-act="rest-adj" data-d="-15">-15s</button><button class="btn sm" data-act="rest-adj" data-d="15">+15s</button><button class="btn sm" data-act="rest-skip">Skip</button><div class="bar" id="restBar"></div>`;
  }
  $('#restT').textContent=clock(left);$('#restBar').style.width=(left/Math.max(1,S.restTotal)*100)+'%';
}
setInterval(()=>{
  if(!S.session)return;
  const el=(Date.now()-S.session.start)/1000;
  const c=$('#sessClock');if(c)c.textContent=clock(el);
  const m=$('#miniClock');if(m)m.textContent=`${clock(el)} · ${S.session.ex.length} exercises`;
  if(S.restEnd){
    if(Date.now()>=S.restEnd){S.restEnd=0;renderRest();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast('Rest complete — next set!')}
    else renderRest();
  }
},1000);

function computePRs(ex){
  const out=[];ex.forEach(e=>{const k=EXM[e.id]?.k||'weight';const prior=bestOf(e.id).v;if(!prior)return;let best=0;e.sets.forEach(s=>{best=Math.max(best,metric(k,s))});
    if(best>prior+1e-9)out.push({id:e.id,v:best,label:`${EXM[e.id].n}: ${metricName[k]} ${metricLabel(k,best)}`})});return out;
}
let pendingFinish=null;
function finishPrompt(){
  const s=S.session;
  const ex=s.ex.map(e=>{const k=EXM[e.id]?.k||'weight';return{id:e.id,name:EXM[e.id]?.n||e.id,sets:e.sets.filter(x=>x.done||(x.r>0)).map(x=>({w:x.w==null?(k==='hold'?0:(lastPerf(e.id)||[])[0]?.w||0):x.w,r:x.r||0})).filter(x=>x.r>0)}}).filter(e=>e.sets.length);
  if(!ex.length){toast('Log at least one set before finishing');return}
  const end=Date.now(),dur=Math.max(60,Math.round((end-s.start)/1000));
  const vol=ex.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+setVol(EXM[e.id]?.k||'weight',x),0),0),sets=ex.reduce((a,e)=>a+e.sets.length,0);
  const prs=computePRs(ex);
  pendingFinish={id:'w-'+end.toString(36),name:(s.name||'Workout').trim()||'Workout',dateKey:dayKey(s.start),start:s.start,end,dur,ex,vol,sets,prs};
  openModal(`<div class="m-body" style="padding-top:28px"><div class="sum-hero"><div class="trophy">${I('trophy')}</div><h2 style="font-size:24px">Workout complete</h2><p class="t2" style="margin-top:4px">${esc(pendingFinish.name)} · ${fmtDate(s.start,{weekday:'long',month:'short',day:'numeric'})}</p></div>
    <div class="sum-grid"><div class="stat"><div class="lab">${I('clock')}Duration</div><div class="val">${fmtDur(dur)}</div></div><div class="stat"><div class="lab">${I('train')}Volume</div><div class="val">${fmtBig(toD(vol))}<small>${U()}</small></div></div>
    <div class="stat"><div class="lab">${I('layers')}Sets</div><div class="val">${sets}</div></div><div class="stat"><div class="lab">${I('trophy')}New PRs</div><div class="val">${prs.length}</div></div></div>
    ${prs.length?`<div class="hx">${prs.map(p=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0"><span class="pr-tag">${I('trophy')}PR</span><span style="font-size:14px">${esc(p.label)}</span></div>`).join('')}</div>`:''}
    ${s.ex.some(e=>e.sets.some(x=>!x.done&&!(x.r>0)))?`<p class="muted" style="font-size:12.5px;text-align:center">Empty sets are left out.</p>`:''}</div>
    <div class="m-foot"><button class="btn block" data-act="close-modal">Keep training</button><button class="btn primary block" data-act="save-finish">${I('check')}Save workout</button></div>`,true);
}

  'edit-goal':t=>{const g=S.goals.find(x=>x.id===t.dataset.id);if(g)openGoalModal(g)},
  'save-goal':()=>{
    const title=($('#glTitle').value||'').trim();if(!title){toast('Enter a goal title');return}
    const id=$('#glId').value||'g-'+Date.now().toString(36);
    const mt=$('#glMetric').value;const unitMap={pushups:'reps',squats:'reps',water_ml:'ml',steps:'steps',workouts:'workouts',protein:'g',calories:'kcal',minutes:'min',custom:'check'};
    const existing=S.goals.find(x=>x.id===id);
    saveGoalDoc({id,title,metricType:mt,targetValue:Math.max(1,+$('#glTarget').value||1),unitLabel:unitMap[mt]||'units',startDateKey:$('#glStart').value||S.todayKey,endDateKey:$('#glEnd').value||S.todayKey,active:true,completedDates:existing?existing.completedDates:[]});
    closeModal();renderMain();toast('Goal saved');
  },
  'del-goal':t=>confirmBox('Delete goal?','Remove this personal goal?','Delete',()=>{deleteGoalDoc(t.dataset.id);renderMain();toast('Goal removed')}),
  'toggle-goal-today':t=>{
    const g=S.goals.find(x=>x.id===t.dataset.id);if(!g)return;
    const dates=new Set(g.completedDates||[]);
    if(dates.has(S.todayKey))dates.delete(S.todayKey);else dates.add(S.todayKey);
    saveGoalDoc({...g,completedDates:[...dates]});renderMain();
  },
  'new-custom-ex':()=>openCustomExerciseModal(),
  'save-custom-ex':()=>{
    const n=($('#ceName').value||'').trim();if(!n){toast('Enter an exercise name');return}
    const cue=($('#ceCue').value||'').trim();
    saveCustomExerciseDoc({id:'ce-'+Date.now().toString(36),n,m:$('#ceMus').value,eq:($('#ceEq').value||'Bodyweight').trim(),k:$('#ceKind').value,c:cue?[cue]:[],custom:true});
    closeModal();renderMain();toast('Custom exercise added');
  },
  'start-routine':t=>{const r=allRoutines().find(x=>x.id===t.dataset.id);if(r)startWorkout(r.name,r.ex)},
  'start-empty':()=>startWorkout('Workout',[]),
  'new-routine':()=>openPicker('routine'),
  'del-routine':t=>{const r=S.routines.find(x=>x.id===t.dataset.id);confirmBox('Delete routine?',`“${esc(r?.name)}” will be removed.`,'Delete',()=>{deleteRoutineDoc(t.dataset.id);renderMain();toast('Routine deleted')})},
  'lib-m':t=>{LIB.m=t.dataset.m;renderMain()},
  'open-ex':t=>openExercise(t.dataset.id),
  'ex-start':t=>startWorkout(EXM[t.dataset.id].n,[t.dataset.id]),
  'ex-add-session':t=>{S.session.ex.push({id:t.dataset.id,sets:defaultSets(t.dataset.id)});saveDraft();closeModal();S.sessionOpen=true;rerenderSessionBody();toast('Added to workout')},
  'pk-m':t=>{PK.m=t.dataset.m;renderPicker()},
  'pk-toggle':t=>{const id=t.dataset.id;const i=PK.sel.indexOf(id);i>=0?PK.sel.splice(i,1):PK.sel.push(id);renderPicker()},
  'pk-done':()=>{
    if(!PK.sel.length){toast('Pick at least one exercise');return}
    if(PK.mode==='routine'){const name=($('#pkname').value||'').trim();if(!name){toast('Give your routine a name');$('#pkname').focus();return}
      saveRoutineDoc({id:'r-'+Date.now().toString(36),name,ex:PK.sel.slice()});closeModal();renderMain();toast('Routine saved')}
    else{PK.sel.forEach(id=>S.session.ex.push({id,sets:defaultSets(id)}));saveDraft();closeModal();rerenderSessionBody()}
  },
  'resume':()=>{S.sessionOpen=true;renderSession()},
  'minimize':()=>{S.sessionOpen=false;renderSession()},
  'add-ex':()=>openPicker('session'),
  'rm-ex':t=>{S.session.ex.splice(+t.dataset.ei,1);saveDraft();rerenderSessionBody()},
  'add-set':t=>{const e=S.session.ex[+t.dataset.ei];e.sets.push({w:null,r:null,done:false});saveDraft();rerenderSessionBody()},
  'rm-set':t=>{const e=S.session.ex[+t.dataset.ei];if(e.sets.length>1)e.sets.pop();saveDraft();rerenderSessionBody()},
  'toggle-set':t=>{
    try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}else if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}
    const row=t.closest('.srow');const e=S.session.ex[+row.dataset.ei];const s=e.sets[+row.dataset.si];const k=EXM[e.id].k;
    if(s.done){s.done=false}else{
      const p=(lastPerf(e.id)||[])[+row.dataset.si]||(lastPerf(e.id)||[]).slice(-1)[0];
      if(s.r==null&&p)s.r=p.r;if(s.w==null&&p&&k!=='hold')s.w=p.w;
      if(!(s.r>0)){toast(k==='hold'?'Enter seconds first':k==='cardio'?'Enter minutes first':'Enter reps first');row.querySelector('[data-f=r]').focus();return}
      if(s.w==null&&k==='weight'){toast('Enter weight first');row.querySelector('[data-f=w]').focus();return}
      s.done=true;if(k!=='cardio')startRest(S.profile.rest);
    }
    saveDraft();rerenderSessionBody();
  },
  'rest-adj':t=>{S.restEnd+= +t.dataset.d*1000;S.restTotal=Math.max(S.restTotal,(S.restEnd-Date.now())/1000);if(S.restEnd<=Date.now())S.restEnd=0;renderRest()},
  'rest-skip':()=>{S.restEnd=0;renderRest()},
  'finish':()=>finishPrompt(),
  'discard':()=>confirmBox('Discard workout?','Everything logged in this session will be lost.','Discard',()=>{S.session=null;S.restEnd=0;lsSet(LS_SESS,null);renderSession();renderMain();toast('Workout discarded')}),
  'save-finish':()=>{
    const w=pendingFinish;if(!w)return;pendingFinish=null;S.workouts.unshift(w);S.workouts.sort((a,b)=>b.start-a.start);
    saveWorkoutDoc(w);S.session=null;S.restEnd=0;S.sessionOpen=false;lsSet(LS_SESS,null);closeModal();renderSession();
    if(location.hash!=='#home')location.hash='#home';else renderMain();
    toast(w.prs.length?`Saved! ${w.prs.length} new PR${w.prs.length>1?'s':''}`:'Workout saved — great work!');
  },
  'repeat':t=>{const w=S.workouts.find(x=>x.id===t.dataset.id);if(w)startWorkout(w.name,(w.ex||[]).map(e=>e.id))},
  'del-wo':t=>confirmBox('Delete workout?','Removes this workout from your log.','Delete',()=>{S.workouts=S.workouts.filter(x=>x.id!==t.dataset.id);deleteWorkoutDoc(t.dataset.id);renderMain();toast('Workout deleted')}),
  'log-bw':()=>{
    const v=parseFloat(($('#bwIn').value||'').replace(',','.'));if(!(v>20&&v<700)){toast('Enter a valid weight');$('#bwIn').focus();return}
    saveMeasurementDoc({d:S.todayKey,kg:fromD(v)});renderMain();toast('Weight logged');
  },
  'open-meas':()=>openFullMeasurementModal(),
  'save-meas':()=>{
    const wt=parseFloat($('#msWt').value||'');if(!(wt>20&&wt<700)){toast('Enter weight');return}
    const m={d:$('#msDate').value||S.todayKey,kg:fromD(wt)};
    if($('#msBf').value)m.bodyFatPct=+$('#msBf').value;
    if($('#msWaist').value)m.waistCm=+$('#msWaist').value;
    if($('#msChest').value)m.chestCm=+$('#msChest').value;
    if($('#msArm').value)m.armCm=+$('#msArm').value;
    saveMeasurementDoc(m);closeModal();renderMain();toast('Measurements saved');
  },
  'del-bw':t=>{deleteMeasurementDoc(t.dataset.d);renderMain()},
  'set-unit':t=>{S.profile.unit=t.dataset.v;saveProfile();renderMain()},
  'set-goal':t=>{S.profile.goal=+t.dataset.v;saveProfile();renderMain()},
  'set-rest':t=>{S.profile.rest=+t.dataset.v;saveProfile();renderMain()},
  'set-theme':t=>{S.profile.theme=t.dataset.v;saveProfile();applyTheme();renderMain()},
  'set-wrem':t=>{S.profile.workoutReminderEnabled=t.dataset.v==='true';saveProfile();renderMain()},
  'set-hrem':t=>{S.profile.waterReminderEnabled=t.dataset.v==='true';saveProfile();renderMain()},
  'set-hint':t=>{S.profile.waterReminderIntervalHours=+t.dataset.v;saveProfile();renderMain()},
  'req-notif':()=>{if(hasBridge())window.ForgeBridge.requestNotificationPermission();else toast('Notifications require Android runtime')},
  'hc-connect':()=>{if(hasBridge())window.ForgeBridge.requestHealthConnect();else toast('Health Connect requires Android device')},
  'hc-sync':()=>{if(hasBridge())window.ForgeBridge.syncHealthConnectNow();else toast('Health Connect requires Android device')},
  'signout':()=>confirmBox('Sign out?','Sign out of your Google account on this device?','Sign out',()=>{if(hasBridge())window.ForgeBridge.signOutGoogle()},false),
  'export':async()=>{
    const data=JSON.stringify({profile:S.profile,weights:S.weights,routines:S.routines,workouts:S.workouts,dailyLogs:S.dailyLogs,goals:S.goals,customExercises:S.customExercises,customMeals:S.customMeals},null,1);
    if(hasBridge()){window.ForgeBridge.copyToClipboard(data);toast('Backup copied to clipboard');return}
    try{await navigator.clipboard.writeText(data);toast('Backup copied to clipboard')}catch(e){toast('Backup ready')}
  },
  'reset':()=>confirmBox('Erase all data?','All cloud and local workouts, logs, goals, and routines will be deleted.','Erase everything',()=>{
    if(hasBridge())window.ForgeBridge.eraseAllData();
    S.workouts=[];S.dailyLogs=[];S.goals=[];S.weights=[];S.routines=[];S.customExercises=[];S.customMeals=[];
    S.profile={...DEF_PROFILE,theme:S.profile.theme};rebuildCatalog();persistLocal();renderMain();toast('All data erased');
  }),
  /* AI Coach actions */
  'ai-prompt':t=>{if($('#aiChatIn'))$('#aiChatIn').value=t.dataset.q;A['ai-send']()},
  'ai-send':()=>{
    const q=($('#aiChatIn')?.value||'').trim();if(!q||AI_STATE.busy)return;
    $('#aiChatIn').value='';AI_STATE.messages.push({role:'user',text:q});AI_STATE.busy=true;renderMain();
    if(hasBridge())window.ForgeBridge.askAiCoach('req-'+Date.now(),q,buildAiContext());
    else window.__FORGE_ON_AI_RESULT('chat',{source:'offline',text:'Offline preview: connect Android build for Gemini 3.8 Flash.'});
  },
  'ai-gen-wo':()=>{
    if(AI_STATE.busy)return;
    AI_STATE.workoutFocus=$('#aiFocus')?.value||AI_STATE.workoutFocus;
    AI_STATE.workoutEquip=$('#aiEquip')?.value||AI_STATE.workoutEquip;
    AI_STATE.busy=true;renderMain();
    const ids=JSON.stringify(EX.map(e=>e.id));
    if(hasBridge())window.ForgeBridge.generateAiWorkout('wo-'+Date.now(),AI_STATE.workoutFocus,AI_STATE.workoutEquip,ids,buildAiContext());
  },
  'ai-start-wo':()=>{const p=AI_STATE.workoutPlan;if(p)startWorkout(p.title||'AI Workout',p.exerciseIds||[])},
  'ai-save-routine':()=>{const p=AI_STATE.workoutPlan;if(!p)return;saveRoutineDoc({id:'r-'+Date.now().toString(36),name:p.title||'AI Routine',ex:(p.exerciseIds||[]).filter(id=>EXM[id])});toast('Saved to My Routines')},
  'ai-gen-diet':()=>{
    if(AI_STATE.busy)return;
    AI_STATE.dietPref=$('#aiDietPref')?.value||AI_STATE.dietPref;
    AI_STATE.busy=true;renderMain();
    if(hasBridge())window.ForgeBridge.suggestAiDiet('diet-'+Date.now(),AI_STATE.dietPref,buildAiContext());
  },
  'ai-log-meal':t=>{
    const m=(AI_STATE.dietPlan?.meals||[])[+t.dataset.i];if(!m)return;
    const l=getLog();saveDailyLogDoc({...l,meals:[...(l.meals||[]),{id:'m-'+Date.now().toString(36),mealType:m.mealType||'Lunch',name:m.name,calories:+m.calories||0,proteinGrams:+m.proteinGrams||0,carbsGrams:+m.carbsGrams||0,fatGrams:+m.fatGrams||0,timeMs:Date.now()}]});
    toast(`Logged ${m.name} to today`);
  },
  'ai-save-meal':t=>{
    const m=(AI_STATE.dietPlan?.meals||[])[+t.dataset.i];if(!m)return;
    saveCustomMealDoc({id:'cm-'+Date.now().toString(36),name:m.name,mealType:m.mealType||'Lunch',calories:+m.calories||0,proteinGrams:+m.proteinGrams||0,carbsGrams:+m.carbsGrams||0,fatGrams:+m.fatGrams||0});
    toast('Saved to Custom Meals');
  },
  'ai-analyze':()=>{
    if(AI_STATE.busy)return;AI_STATE.busy=true;renderMain();
    if(hasBridge())window.ForgeBridge.analyzeAiProgress('an-'+Date.now(),buildAiContext());
  }
};

document.addEventListener('click',e=>{
  const mini=e.target.closest('#mini');if(mini&&!e.target.closest('[data-act]')){A.resume();return}
  const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.chg==='name'){S.profile.name=t.value.trim();saveProfile();toast('Name updated');return}
  if(t.dataset.chg==='prog-ex'){PROG.ex=t.value;drawStrength();return}
  if(t.dataset.chg==='rem-time'){const[hh,mm]=(t.value||'18:00').split(':').map(Number);S.profile.workoutReminderHour=hh||18;S.profile.workoutReminderMinute=mm||0;saveProfile();toast('Reminder time updated');return}
  if(t.dataset.target){S.profile[t.dataset.target]=Math.max(0,+t.value||0);saveProfile();toast('Target saved')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(e.target.id==='obName')A['ob-go']();
    if(e.target.id==='bwIn')A['log-bw']();
    if(e.target.id==='aiChatIn')A['ai-send']();
  }
});

/* ---------- boot ---------- */
$('#logo1').innerHTML=$('#logo2').innerHTML=I('bolt');
$('#topprof').innerHTML=I('user');
loadLocal();
if(S.session)S.sessionOpen=false;
render();
setSync(hasBridge()?'loading':'local');
</script>
</body>
</html>
