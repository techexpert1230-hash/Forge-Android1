<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge — Fitness Tracker</title>
<meta name="theme-color" content="#0A0B0D">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{
  font-family:'Archivo';
  src:url('fonts/archivo.ttf') format('truetype');
  font-weight:100 900;
  font-stretch:62.5% 125%;
  font-display:swap;
}
@font-face{
  font-family:'Inter';
  src:url('fonts/inter.ttf') format('truetype');
  font-weight:100 900;
  font-display:swap;
}
:root{
  --r:18px;--font:'Inter',system-ui,-apple-system,sans-serif;--display:'Archivo','Inter',sans-serif;--side:248px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
[data-theme=dark]{
  --bg:#0A0B0D;--surface:#131417;--surface2:#1A1C20;--surface3:#24272C;--border:#24272C;
  --text:#F3F4F6;--text2:#A6AAB2;--muted:#71767F;
  --accent:#C7FF35;--accent-ink:#0A0B0D;--accent-text:#C7FF35;--chart:#C7FF35;--chart-soft:rgba(199,255,53,.14);
  --danger:#FF6B6B;--good:#4ADE80;--warn:#F5B83D;--overlay:rgba(0,0,0,.72);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 24px 48px -28px rgba(0,0,0,.9);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#F2F2EE;--surface:#FFFFFF;--surface2:#F1F1EC;--surface3:#E6E6E0;--border:#E4E4DE;
  --text:#121316;--text2:#4E525A;--muted:#7E828A;
  --accent:#C7FF35;--accent-ink:#121316;--accent-text:#4B6600;--chart:#577800;--chart-soft:rgba(87,120,0,.11);
  --danger:#D23B3B;--good:#16803C;--warn:#C27803;--overlay:rgba(20,20,18,.44);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 16px 36px -24px rgba(0,0,0,.28);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none}
h1,h2,h3,.display{font-family:var(--display);font-stretch:112%;letter-spacing:-.02em;line-height:1.08}
h1{font-size:30px;font-weight:800}
h2{font-size:19px;font-weight:750}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.t2{color:var(--text2)}
.acc{color:var(--accent-text)}
small{font-size:12.5px}

/* layout */
.app{min-height:100vh;display:flex}
.side{width:var(--side);flex:none;position:sticky;top:0;height:100vh;padding:calc(22px + var(--sat)) 16px 20px calc(16px + var(--sal));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#0A0B0D;display:grid;place-items:center;box-shadow:0 0 18px rgba(199,255,53,.28)}
.brand b{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:20px;letter-spacing:.02em}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--text2);font-weight:550;text-decoration:none;min-height:44px}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.on{background:var(--surface3);color:var(--text)}
.nav-btn.on .ic{color:var(--accent-text)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:0 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)}
.dot.warn{background:var(--warn)}
.main{flex:1;min-width:0;padding:calc(28px + var(--sat)) calc(36px + var(--sar)) 72px 36px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:none}
.bnav{display:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-h p{color:var(--text2);margin-top:5px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:16px 18px}
.stat .lab{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px;font-weight:550}
.stat .lab .ic{width:16px;height:16px;color:var(--muted)}
.stat .val{font-family:var(--display);font-stretch:110%;font-size:26px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .val small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:500;margin-left:3px;letter-spacing:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:13px;font-weight:650;background:var(--surface2);border:1px solid var(--border);transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#0A0B0D;border-color:transparent;box-shadow:0 0 24px rgba(199,255,53,.16)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:40px;padding:0 13px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn .ic{width:18px;height:18px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text2)}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.link{color:var(--accent-text);font-weight:600;font-size:13.5px;min-height:36px;display:inline-flex;align-items:center;gap:4px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px;color:#F4F5F7;background:#0E0F12;border:1px solid #1F2226;
  background-image:radial-gradient(600px 300px at 100% 0%,rgba(199,255,53,.22),transparent 60%),radial-gradient(400px 260px at 0% 100%,rgba(199,255,53,.08),transparent 60%)}
.hero .muted{color:#8D929B}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.hero h1{font-size:34px}
.hero .chips{margin-top:16px}
.hero .pill{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.08);color:#E6E8EB}
.ring{position:relative;width:148px;height:148px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .big{font-family:var(--display);font-stretch:112%;font-size:36px;font-weight:850;line-height:1}
.ring .in small{color:#8D929B;display:block;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;font-weight:600}
.pill .ic{width:15px;height:15px}
.pill.acc{border-color:rgba(199,255,53,.35);color:var(--accent-text);background:var(--chart-soft)}
.pill.acc .ic{color:var(--accent-text)}
.hero .pill .ic{color:#C7FF35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:#0A0B0D;border-color:transparent}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:22px;max-width:420px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#8D929B;font-weight:600}
.wd i{width:34px;height:34px;border-radius:50%;border:1.5px solid #2A2D33;display:grid;place-items:center;font-style:normal;color:#0A0B0D}
.wd i.on{background:#C7FF35;border-color:#C7FF35}
.wd i.today{border-color:#F4F5F7}
.wd i .ic{width:16px;height:16px}

/* up next */
.next{display:flex;align-items:center;gap:18px}
.next .bigic{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#0A0B0D;display:grid;place-items:center;flex:none}
.next .bigic .ic{width:26px;height:26px}
.next .txt{flex:1;min-width:0}
.next .txt b{font-family:var(--display);font-stretch:110%;font-size:20px;font-weight:800;display:block}

/* lists */
.wo{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.wo:first-child{border-top:0;padding-top:4px}
.date-badge{width:48px;height:52px;border-radius:13px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.date-badge b{font-family:var(--display);font-size:19px;font-weight:800;line-height:1}
.date-badge span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:3px}
.wo .info{flex:1;min-width:0}
.wo .info b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--text2);margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .ic{width:14px;height:14px;color:var(--muted)}
.pr-tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:99px;background:var(--chart-soft);color:var(--accent-text);font-size:12px;font-weight:700}
.pr-tag .ic{width:13px;height:13px}

/* programs */
.prog{display:flex;flex-direction:column;gap:12px}
.prog .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prog h3{font-size:18px}
.prog ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--text2);flex:1}
.prog li{display:flex;gap:8px;align-items:center}
.prog li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-text);flex:none}
.prog .pf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--border)}
.quick{display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap}
.add-card{border:1.5px dashed var(--surface3);background:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:180px;color:var(--text2);font-weight:600;width:100%}
.add-card:hover{border-color:var(--accent-text);color:var(--text)}
.add-card .ic{width:28px;height:28px}

/* library */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.search .ic{color:var(--muted);width:18px;height:18px}
.search input{flex:1;background:none;border:0;outline:none;min-width:0}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.exi{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
.exi:hover{border-color:var(--surface3)}
.exi .info{flex:1;min-width:0}
.exi b{display:block;font-weight:650}
.mb{width:44px;height:44px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-stretch:120%;font-weight:850;font-size:13px;color:var(--accent-text);flex:none;letter-spacing:.03em}
.exi .chev{color:var(--muted)}

/* progress & charts */
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;overflow-x:auto;padding-bottom:4px}
.hm i{width:14px;height:14px;border-radius:4px;background:var(--surface2)}
.hm i.l1{background:color-mix(in oklab,var(--chart) 30%,var(--surface2))}
.hm i.l2{background:color-mix(in oklab,var(--chart) 55%,var(--surface2))}
.hm i.l3{background:color-mix(in oklab,var(--chart) 78%,var(--surface2))}
.hm i.l4{background:var(--chart)}
.hm i.fut{background:transparent}
.hm-wrap{display:flex;gap:8px}
.hm-days{display:grid;grid-template-rows:repeat(7,14px);gap:4px;font-size:10.5px;color:var(--muted);font-weight:600}
.legend-scale{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:12px}
.legend-scale i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:12px;font-size:13.5px}
.hbar .tr{height:10px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hbar .fill{height:10px;border-radius:0 4px 4px 0;background:var(--chart);min-width:2px}
.hbar .v{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.hbar .n{color:var(--text2);font-weight:550}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .grid-l{stroke:var(--border);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .xhair{stroke:var(--text2);stroke-width:1;stroke-dasharray:3 3}
.chart-empty{height:160px;display:grid;place-items:center;color:var(--muted);font-size:13.5px;text-align:center;border:1px dashed var(--surface3);border-radius:14px;padding:16px}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:10px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-12px;opacity:0;transition:opacity .12s;z-index:5;font-variant-numeric:tabular-nums}
.tip b{font-weight:700}
.tip.show{opacity:1}
#gtip{position:fixed;transform:translate(-50%,-100%);margin-top:-8px;z-index:200}
.row-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);padding:0 14px;outline:none;min-width:0}
.field:focus{border-color:var(--accent-text)}
select.field{padding-right:30px}
.unit-in{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:12px;height:44px;padding-right:12px}
.unit-in input{width:105px;background:none;border:0;outline:none;height:100%;padding:0 12px;font-weight:600}
.unit-in span{color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--border);font-size:14px}
.kv:first-child{border-top:0}
details.tbl summary{cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;margin-top:12px;list-style:none}
details.tbl summary::-webkit-details-marker{display:none}
details.tbl summary::before{content:"▸ ";color:var(--muted)}
details.tbl[open] summary::before{content:"▾ "}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px}
.pr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pr{padding:14px;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;gap:4px}
.pr .pv{font-family:var(--display);font-stretch:110%;font-size:21px;font-weight:800}
.pr .pn{font-weight:600;font-size:13.5px}

/* history & calendar */
.month{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 0 -6px}
details.hist{padding:0;overflow:hidden}
details.hist summary{list-style:none;cursor:pointer;padding:16px 18px}
details.hist summary::-webkit-details-marker{display:none}
details.hist .wo{border:0;padding:0}
.hist-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.hx{background:var(--surface2);border-radius:14px;padding:12px 14px}
.hx b{font-weight:650;font-size:14px}
.hx .sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hx .sets span{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:4px 9px;font-size:12.5px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .bigic{width:64px;height:64px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;color:var(--accent-text)}
.empty .bigic .ic{width:30px;height:30px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal-wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-day{min-height:50px;border-radius:12px;background:var(--surface2);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;font-size:13.5px;font-weight:650;position:relative}
.cal-day.empty{background:transparent;pointer-events:none}
.cal-day.today{border-color:var(--text2)}
.cal-day.sel{border-color:var(--accent-text);background:var(--chart-soft)}
.cal-dots{display:flex;gap:3px;height:5px}
.cal-dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal-dots i.w{background:var(--accent-text)}
.cal-dots i.d{background:var(--good)}

/* daily tracker & goals & nutrition */
.pbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.pbar.good>i{background:var(--good)}
.pbar.warn>i{background:var(--warn)}
.water-cups{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cup{width:34px;height:38px;border-radius:8px;border:1.5px solid var(--surface3);background:var(--surface2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.cup.on{background:var(--chart-soft);border-color:var(--accent-text);color:var(--accent-text)}
.meal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.meal-row:first-child{border-top:0}
.goal-card{display:flex;flex-direction:column;gap:10px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.good{background:rgba(74,222,128,.14);color:var(--good)}
.badge.miss{background:rgba(255,107,107,.14);color:var(--danger)}
.badge.acc{background:var(--chart-soft);color:var(--accent-text)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach{padding:14px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.ach.on{border-color:rgba(199,255,53,.4);background:var(--chart-soft)}
.ach .ic-box{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted)}
.ach.on .ic-box{background:var(--accent);color:#0A0B0D}

/* AI coach */
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:#0A0B0D;font-weight:550;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}

/* profile */
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{min-height:38px;min-width:44px;padding:0 13px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
[data-theme=dark] .seg button.on{background:var(--surface3)}
.set-line{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.set-line:first-of-type{border-top:0}
.set-line .lt b{display:block;font-weight:600}
.set-line .lt small{color:var(--muted)}
textarea.field{width:100%;height:120px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}

/* session overlay */
#session{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#session.open{display:flex}
.sess-h{display:flex;align-items:center;gap:12px;padding:calc(14px + var(--sat)) calc(20px + var(--sar)) 14px calc(20px + var(--sal));border-bottom:1px solid var(--border);background:var(--surface)}
.sess-h .mid{flex:1;min-width:0}
.sess-name{background:none;border:0;outline:none;font-family:var(--display);font-stretch:110%;font-weight:800;font-size:20px;width:100%;letter-spacing:-.01em}
.sess-clock{font-size:13px;color:var(--accent-text);font-weight:650;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.sess-clock .ic{width:14px;height:14px}
.sess-b{flex:1;overflow-y:auto;padding:20px 20px 140px}
.sess-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ex-card{padding:16px}
.ex-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ex-h .info{flex:1;min-width:0}
.ex-h b{font-weight:700;font-size:15.5px;display:block}
.ex-h b button{text-align:left}
.srow{display:grid;grid-template-columns:34px 1fr 76px 76px 44px;gap:8px;align-items:center;padding:5px 0;border-radius:11px}
.srow.head{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:0 0 4px}
.srow.head span:nth-child(n+3){text-align:center}
.srow .sn{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.srow .prev{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow input{height:40px;width:100%;text-align:center;border-radius:10px;background:var(--surface2);border:1px solid transparent;outline:none;font-weight:650;font-variant-numeric:tabular-nums}
.srow input:focus{border-color:var(--accent-text)}
.srow .blank{text-align:center;color:var(--muted)}
.chk{width:40px;height:40px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.srow.done{background:var(--chart-soft)}
.srow.done .chk{background:var(--accent);color:#0A0B0D}
.srow.done input{background:transparent}
.srow.done .sn{background:var(--accent);color:#0A0B0D}
.ex-actions{display:flex;gap:8px;margin-top:10px}
.ex-actions .btn{flex:1}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));z-index:65;width:min(560px,calc(100% - 32px));background:#0E0F12;color:#F4F5F7;border:1px solid #2A2D33;border-radius:20px;padding:14px 16px;display:none;align-items:center;gap:14px;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);overflow:hidden}
.rest.show{display:flex}
.rest .rt{font-family:var(--display);font-stretch:112%;font-size:28px;font-weight:850;font-variant-numeric:tabular-nums;min-width:84px}
.rest .rl{flex:1;font-size:13px;color:#8D929B}
.rest .rl b{display:block;color:#F4F5F7;font-size:14px}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:#C7FF35;transition:width 1s linear}
.rest .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#F4F5F7}
#mini{position:fixed;z-index:55;left:calc(var(--side) + 24px);right:24px;bottom:24px;max-width:640px;margin:0 auto;background:#0E0F12;color:#F4F5F7;border:1px solid #2A2D33;border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);cursor:pointer}
#mini[hidden]{display:none}
#mini .pulse{width:10px;height:10px;border-radius:50%;background:#C7FF35;box-shadow:0 0 0 0 rgba(199,255,53,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(199,255,53,0)}100%{box-shadow:0 0 0 0 rgba(199,255,53,0)}}
#mini .mt{flex:1;min-width:0}
#mini .mt b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mt small{color:#8D929B;font-variant-numeric:tabular-nums}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
.m-back{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(4px)}
.m-box{position:relative;width:min(560px,100%);max-height:min(88vh,820px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);overflow:hidden;animation:pop .18s ease-out}
.m-box.sm{width:min(420px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 12px}
.m-body{padding:4px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.m-foot{padding:14px 20px calc(18px + var(--sab));border-top:1px solid var(--border);display:flex;gap:10px}
.pk-list{display:flex;flex-direction:column;gap:2px;min-height:200px}
.pk{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:12px;text-align:left;width:100%}
.pk:hover{background:var(--surface2)}
.pk .mb{width:38px;height:38px;font-size:11.5px;border-radius:11px}
.pk .info{flex:1;min-width:0}
.pk b{font-weight:600;display:block;font-size:14.5px}
.pk .box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--surface3);display:grid;place-items:center;color:transparent}
.pk.on .box{background:var(--accent);border-color:var(--accent);color:#0A0B0D}
.pk .box .ic{width:15px;height:15px}
.cues{list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:10px}
.cues li{counter-increment:c;display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.cues li::before{content:counter(c);width:24px;height:24px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--accent-text)}
.sum-hero{text-align:center;padding:8px 0 4px}
.sum-hero .trophy{width:72px;height:72px;border-radius:22px;background:var(--accent);color:#0A0B0D;display:grid;place-items:center;margin:0 auto 14px}
.sum-hero .trophy .ic{width:34px;height:34px}
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sum-grid .stat{background:var(--surface2);border-radius:14px}
.sum-grid .val{font-size:24px}
#toast{position:fixed;left:50%;bottom:calc(82px + var(--sab));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.form-row{display:flex;flex-direction:column;gap:6px}
.form-row label{font-size:12.5px;font-weight:650;color:var(--text2)}

@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{display:none}
  .main{padding:calc(10px + var(--sat)) calc(14px + var(--sar)) calc(114px + var(--sab)) calc(14px + var(--sal))}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 4px}
  .topbar .brand{padding:0}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:6px 4px calc(6px + var(--sab))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;min-height:48px;padding:4px 0}
  .bnav a.on{color:var(--text)}
  .bnav a.on .ic{color:var(--accent-text)}
  #mini{left:12px;right:12px;bottom:calc(74px + var(--sab))}
  h1{font-size:26px}
  .hero{padding:20px;border-radius:22px}
  .hero h1{font-size:27px}
  .hero-grid{grid-template-columns:1fr}
  .ring{width:124px;height:124px;justify-self:center}
  .rest .rl span{display:none}
  .rest{gap:8px;padding:12px}
  .rest .rt{min-width:70px;font-size:24px}
  .g2,.g3{grid-template-columns:1fr}
  .sess-b{padding:14px 12px 140px}
  .srow{grid-template-columns:30px 1fr 64px 64px 40px;gap:6px}
  #modal{align-items:flex-end;padding:0}
  .m-box{width:100%;border-radius:24px 24px 0 0;max-height:92vh}
}
@media (max-width:420px){.srow .prev{font-size:12px}}
</style>
</head>
<body>

const toD=kg=>U()==='lb'?kg*KG2LB:kg;
const fromD=v=>U()==='lb'?v/KG2LB:v;
const fmtN=v=>{v=Math.round(v*10)/10;return Number.isInteger(v)?String(v):v.toFixed(1)};

const fmtBig=v=>v>=1e6?(v/1e6).toFixed(1).replace(/\.0$/,'')+'M':v>=1e4?(v/1e3).toFixed(1).replace(/\.0$/,'')+'k':Math.round(v).toLocaleString('en-US');
const fmtDur=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}h ${m}m`:`${m}m`};
const clock=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};

function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
function addDays(ts,n){const d=new Date(ts);d.setDate(d.getDate()+n);return d.getTime()}
function dayKey(ts=Date.now()){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function keyTs(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,(m||1)-1,d||1).getTime()}
function monthKey(k){return(k||'').slice(0,7)}
function yearKey(k){return(k||'').slice(0,4)}
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
function setVol(k,s){return(k==='weight'||k==='bw')?(s.w||0)*(s.r||0):0}
function setLabel(k,s){

function metric(k,s){if(k==='weight')return s.w>0&&s.r>0?e1rm(s.w,s.r):0;if(k==='cardio')return s.w||0;return s.r||0}
function metricLabel(k,v){if(k==='weight')return`${fmtW(v)} ${U()}`;if(k==='bw')return`${v} reps`;if(k==='hold')return`${v}s`;return`${fmtN(v)} km`}

/* ---------- daily log & goal helpers ---------- */
function getLog(dk=S.todayKey||dayKey()){
  return S.dailyLogs.find(x=>x.dateKey===dk)||{
    dateKey:dk,pushUps:0,squats:0,waterMl:0,steps:0,healthConnectSteps:0,
    workoutMinutes:0,caloriesBurned:0,otherActivities:[],meals:[],notes:''
  };
}
function mealMacros(meals=[]){
  return meals.reduce((a,m)=>({
    calories:a.calories+(+m.calories||0),
    protein:a.protein+(+m.proteinGrams||0),
    carbs:a.carbs+(+m.carbsGrams||0),
    fat:a.fat+(+m.fatGrams||0),
    count:a.count+1
  }),{calories:0,protein:0,carbs:0,fat:0,count:0});
}
function isGoalMetForDate(g,dk){
  if((g.completedDates||[]).includes(dk))return true;
  const log=getLog(dk);
  const mac=mealMacros(log.meals||[]);
  switch(g.metricType){
    case 'pushups':return(log.pushUps||0)>=g.targetValue;
    case 'squats':return(log.squats||0)>=g.targetValue;
    case 'water_ml':return(log.waterMl||0)>=g.targetValue;
    case 'steps':return(log.steps||0)>=g.targetValue;
    case 'workouts':return S.workouts.filter(w=>(w.dateKey||dayKey(w.start))===dk).length>=g.targetValue;
    case 'calories':return mac.calories>=g.targetValue;
    case 'protein':return mac.protein>=g.targetValue;
    case 'minutes':return(log.workoutMinutes||0)>=g.targetValue;
    default:return false;
  }
}
function goalWindowStats(g){
  const start=keyTs(g.startDateKey||S.todayKey),end=keyTs(g.endDateKey||S.todayKey),today=keyTs(S.todayKey);
  const upTo=Math.min(end,today);
  let totalDays=Math.max(1,Math.round((end-start)/DAY)+1);
  let elapsedDays=upTo>=start?Math.round((upTo-start)/DAY)+1:0;
  let completed=0,missed=0;
  for(let i=0;i<elapsedDays;i++){
    const dk=dayKey(addDays(start,i));
    if(isGoalMetForDate(g,dk))completed++;
    else if(dk<S.todayKey)missed++;
  }
  const todayMet=isGoalMetForDate(g,S.todayKey);
  return{totalDays,elapsedDays,completed,missed,todayMet};
}
function dayTargetSummary(dk=S.todayKey){
  const p=S.profile,log=getLog(dk),mac=mealMacros(log.meals||[]);
  const checks=[
    {name:'Push-ups',val:log.pushUps||0,target:p.dailyPushUpsTarget||40,unit:'reps'},
    {name:'Squats',val:log.squats||0,target:p.dailySquatsTarget||50,unit:'reps'},
    {name:'Water',val:log.waterMl||0,target:p.dailyWaterMlTarget||2500,unit:'ml'},
    {name:'Steps',val:log.steps||0,target:p.dailyStepsTarget||8000,unit:'steps'},
    {name:'Protein',val:mac.protein,target:p.dailyProteinTarget||140,unit:'g'}
  ].filter(c=>c.target>0);
  const custom=(S.goals||[]).filter(g=>g.active&&dk>=g.startDateKey&&dk<=g.endDateKey);
  let completed=checks.filter(c=>c.val>=c.target).length;
  let total=checks.length;
  custom.forEach(g=>{total++;if(isGoalMetForDate(g,dk))completed++});
  return{completed,missed:Math.max(0,total-completed),total,pct:total?Math.round(completed/total*100):0};
}

/* ---------- derived workout stats ---------- */
function lastPerf(exId){for(const w of S.workouts){const e=(w.ex||[]).find(x=>x.id===exId);if(e)return e.sets}return null}
function bestOf(exId,list=S.workouts){
  const k=EXM[exId]?.k||'weight';let best=0,at=0,set=null;
  list.forEach(w=>(w.ex||[]).forEach(e=>{
    if(e.id!==exId)return;
    (e.sets||[]).forEach(s=>{const v=metric(k,s);if(v>best){best=v;at=w.start;set=s}});
  }));
  return{v:best,at,set};
}
function weekCounts(){const c={};S.workouts.forEach(w=>{const k=weekStart(w.start);c[k]=(c[k]||0)+1});return c}
function weekStreak(){
  const c=weekCounts(),g=S.profile.goal||4;let ws=weekStart(Date.now()),n=0;
  if((c[ws]||0)>=g)n++;ws=weekStart(addDays(ws,-3));
  while((c[ws]||0)>=g){n++;ws=weekStart(addDays(ws,-3))}return n;
}
function recommend(){
  const last={};S.workouts.forEach(w=>(w.ex||[]).forEach(e=>{const m=EXM[e.id]?.m;if(m&&!(last[m]>=w.start))last[m]=w.start}));
  const now=Date.now();let best=null;
  PRESETS.filter(p=>p.id!=='p-core'&&p.id!=='p-cardio').forEach(p=>{
    const ms=[...new Set(p.ex.map(id=>EXM[id]?.m).filter(Boolean))];
    const days=ms.map(m=>last[m]?(now-last[m])/DAY:30);
    const score=days.reduce((a,b)=>a+Math.min(b,30),0)/Math.max(1,ms.length);
    if(!best||score>best.score+0.01)best={p,score,rest:Math.min(...days),fresh:ms.every(m=>!last[m])};
  });return best;
}
function allRoutines(){return[...S.routines.map(r=>({...r,custom:true})),...PRESETS]}

function aggregatePeriod(period){
  const tk=S.todayKey||dayKey(Date.now());
  const wsKey=dayKey(weekStart(Date.now()));
  const mk=monthKey(tk),yk=yearKey(tk);
  const inRange=dk=>{
    if(period==='daily')return dk===tk;
    if(period==='weekly')return dk>=wsKey&&dk<=tk;
    if(period==='monthly')return monthKey(dk)===mk;
    if(period==='yearly')return yearKey(dk)===yk;
    return true;
  };
  const logs=S.dailyLogs.filter(l=>inRange(l.dateKey));
  const wos=S.workouts.filter(w=>inRange(w.dateKey||dayKey(w.start)));
  const glassMl=Math.max(50,S.profile.glassSizeMl||250);
  let pushUps=0,squats=0,waterMl=0,steps=0,meals=0,calories=0,protein=0,workoutMins=0;
  logs.forEach(l=>{
    pushUps+=l.pushUps||0;squats+=l.squats||0;waterMl+=l.waterMl||0;steps+=l.steps||0;
    workoutMins+=l.workoutMinutes||0;
    const mac=mealMacros(l.meals||[]);
    meals+=mac.count;calories+=mac.calories;protein+=mac.protein;
  });
  let totalExercises=0,totalSets=0,totalVol=0,totalWoSec=0;
  wos.forEach(w=>{
    totalExercises+=(w.ex||[]).length;totalSets+=w.sets||0;totalVol+=w.vol||0;totalWoSec+=w.dur||0;
  });
  const totalHours=((totalWoSec>0?totalWoSec/3600:0)+(workoutMins>0&&totalWoSec===0?workoutMins/60:0));
  const wSorted=S.weights.filter(x=>inRange(x.d)).sort((a,b)=>a.d<b.d?-1:1);
  const weightDelta=wSorted.length>=2?(wSorted[wSorted.length-1].kg-wSorted[0].kg):null;
  const activeDays=Math.max(1,new Set([...logs.map(l=>l.dateKey),...wos.map(w=>w.dateKey||dayKey(w.start))]).size);
  let gComp=0,gTotal=0;
  const seenDays=new Set([...logs.map(l=>l.dateKey),tk]);
  seenDays.forEach(dk=>{if(inRange(dk)){const s=dayTargetSummary(dk);gComp+=s.completed;gTotal+=s.total}});
  return{
    pushUps,squats,waterMl,waterLiters:(waterMl/1000),waterGlasses:Math.round(waterMl/glassMl*10)/10,
    steps,meals,calories,protein,workouts:wos.length,totalExercises,totalSets,totalVol,
    hours:Math.round(totalHours*10)/10,weightDelta,avgDailyCalories:Math.round(calories/activeDays),
    avgDailyWaterL:Math.round((waterMl/1000/activeDays)*10)/10,
    goalCompletionPct:gTotal?Math.round(gComp/gTotal*100):0
  };
}

  return`<div class="wo"><div class="date-badge"><b>${d.getDate()}</b><span>${fmtDate(w.start,{month:'short'})}</span></div>
    <div class="info"><b>${esc(w.name)}</b><div class="meta"><span>${I('clock')}${fmtDur(w.dur)}</span><span>${I('layers')}${w.sets} sets</span>${w.vol?`<span>${I('train')}${fmtBig(toD(w.vol))} ${U()}</span>`:''}</div></div>
    ${w.prs&&w.prs.length?`<span class="pr-tag">${I('trophy')}${w.prs.length} PR</span>`:''}</div>`;
}

    <div class="card"><div class="mb" style="margin-bottom:12px">${I('spark')}</div><h3>AI Coach & Analytics</h3><p class="t2" style="margin-top:6px;font-size:14px">Daily to lifetime analytics calendar plus Gemini 3.8 Flash coaching.</p></div>

V.home=()=>{
  const p=S.profile;
  if(!p.name&&!S.workouts.length&&!S.dailyLogs.length)return onboard();
  const now=Date.now(),ws=weekStart(now),wk=S.workouts.filter(w=>w.start>=ws);
  const cnt=wk.length,goal=p.goal||4,pct=Math.min(1,cnt/goal),C=2*Math.PI*58;
  const streak=weekStreak();
  const vol=wk.reduce((a,w)=>a+w.vol,0),time=wk.reduce((a,w)=>a+w.dur,0);
  const days=new Set(S.workouts.map(w=>dayKey(w.start)));const today=S.todayKey||dayKey(now);
  const strip=[...Array(7)].map((_,i)=>{const t=addDays(ws,i),k=dayKey(t);const on=days.has(k);
    return`<div class="wd" data-tip="${fmtDate(t,{weekday:'long',month:'short',day:'numeric'})}${on?' · trained':''}"><i class="${on?'on':''} ${k===today?'today':''}">${on?I('check'):''}</i>${'MTWTFSS'[i]}</div>`}).join('');
  const rec=recommend();
  const hr=new Date().getHours(),greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const recTxt=rec.fresh?'A great place to start':`Muscles rested ${Math.floor(rec.rest)} day${Math.floor(rec.rest)===1?'':'s'}`;
  const tLog=getLog(today),mac=mealMacros(tLog.meals||[]),gSum=dayTargetSummary(today);
  const glasses=Math.round(((tLog.waterMl||0)/Math.max(50,p.glassSizeMl||250))*10)/10;
  const tgtGlasses=Math.round(((p.dailyWaterMlTarget||2500)/Math.max(50,p.glassSizeMl||250))*10)/10;
  return`
  <section class="hero"><div class="hero-grid"><div>
    <div class="muted" style="font-weight:600">${fmtDate(now,{weekday:'long',month:'long',day:'numeric'})}</div>
    <h1 style="margin-top:6px">${greet}${p.name?', '+esc(p.name):''}.</h1>
    <div class="chips"><span class="pill">${I('flame')}${streak}-week streak</span><span class="pill">${I('target')}Today ${gSum.completed}/${gSum.total} goals</span>${S.healthConnect.hasPermissions?`<span class="pill">${I('heart')}Health Connect</span>`:''}</div>
    <div class="week">${strip}</div>
  </div>
  <div class="ring" role="img" aria-label="${cnt} of ${goal} workouts this week"><svg width="100%" height="100%" viewBox="0 0 148 148"><circle cx="74" cy="74" r="58" fill="none" stroke="#24272C" stroke-width="12"/>
    <circle cx="74" cy="74" r="58" fill="none" stroke="#C7FF35" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .8s"/></svg>
    <div class="in"><div><div class="big">${cnt}<span style="font-size:20px;color:#8D929B">/${goal}</span></div><small>this week</small></div></div></div>
  </div></section>

  <section class="card">
    <div class="card-h"><div><h2>Today’s Check-in</h2><div class="sub">Tap to log push-ups, squats, water & meals</div></div><a class="link" href="#track">Full tracker ${I('chev')}</a></div>
    <div class="grid g4">
      <div class="stat card" style="background:var(--surface2);border:0;box-shadow:none">
        <div class="lab">${I('flame')}Push-ups</div>
        <div class="val">${tLog.pushUps||0}<small>/${p.dailyPushUpsTarget||40}</small></div>
        <div class="pbar"><i style="width:${Math.min(100,(tLog.pushUps||0)/Math.max(1,p.dailyPushUpsTarget||40)*100)}%"></i></div>
        <div class="row-in" style="margin-top:10px"><button class="btn sm primary" data-act="quick-pushup" data-n="10">+10</button><button class="btn sm" data-act="quick-pushup" data-n="20">+20</button></div>
      </div>
      <div class="stat card" style="background:var(--surface2);border:0;box-shadow:none">
        <div class="lab">${I('bolt')}Squats</div>
        <div class="val">${tLog.squats||0}<small>/${p.dailySquatsTarget||50}</small></div>
        <div class="pbar"><i style="width:${Math.min(100,(tLog.squats||0)/Math.max(1,p.dailySquatsTarget||50)*100)}%"></i></div>
        <div class="row-in" style="margin-top:10px"><button class="btn sm primary" data-act="quick-squat" data-n="10">+10</button><button class="btn sm" data-act="quick-squat" data-n="25">+25</button></div>
      </div>
      <div class="stat card" style="background:var(--surface2);border:0;box-shadow:none">
        <div class="lab">${I('drop')}Water</div>
        <div class="val">${glasses}<small>/${tgtGlasses} gl · ${((tLog.waterMl||0)/1000).toFixed(2)}L</small></div>
        <div class="pbar"><i style="width:${Math.min(100,(tLog.waterMl||0)/Math.max(1,p.dailyWaterMlTarget||2500)*100)}%"></i></div>
        <div class="row-in" style="margin-top:10px"><button class="btn sm primary" data-act="quick-water" data-n="1">+1 glass</button><button class="btn sm" data-act="quick-water" data-n="-1">-1</button></div>
      </div>
      <div class="stat card" style="background:var(--surface2);border:0;box-shadow:none">
        <div class="lab">${I('utensils')}Nutrition & Steps</div>
        <div class="val">${mac.calories}<small>kcal · ${mac.protein}g P</small></div>
        <div class="muted" style="font-size:12.5px;margin-top:6px">Steps: <b class="t2">${(tLog.steps||0).toLocaleString()}</b> / ${(p.dailyStepsTarget||8000).toLocaleString()}</div>
        <div class="row-in" style="margin-top:10px"><a class="btn sm" href="#track">+ Meal</a><button class="btn sm" data-act="hc-sync">${I('heart')}Sync</button></div>
      </div>
    </div>
  </section>

  <section class="card next"><div class="bigic">${I('bolt')}</div><div class="txt"><small class="muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em">Up next</small><b>${rec.p.name}</b><div class="t2" style="font-size:13.5px">${rec.p.tag} · ${recTxt}</div></div>
    <button class="btn primary" data-act="start-routine" data-id="${rec.p.id}">${I('play')}Start</button></section>

  <section class="grid g4">
    <div class="card stat"><div class="lab">${I('train')}Volume this week</div><div class="val">${fmtBig(toD(vol))}<small>${U()}</small></div></div>
    <div class="card stat"><div class="lab">${I('clock')}Time trained</div><div class="val">${fmtDur(time)}</div></div>
    <div class="card stat"><div class="lab">${I('target')}Goals today</div><div class="val">${gSum.completed}/${gSum.total}<small>${gSum.pct}%</small></div></div>
    <div class="card stat"><div class="lab">${I('trophy')}All-time workouts</div><div class="val">${S.workouts.length}</div></div>
  </section>

  <section class="grid g2">
    <div class="card"><div class="card-h"><h2>Weekly volume</h2><a class="link" href="#history">Analytics</a></div><div class="chart" id="homeVol"></div></div>
    <div class="card"><div class="card-h"><h2>Recent workouts</h2><a class="link" href="#history">View all</a></div>
      ${S.workouts.length?S.workouts.slice(0,4).map(woRow).join(''):`<div class="chart-empty">Your finished workouts will show up here.<br>Start one from the Train tab.</div>`}</div>
  </section>`;
};
AFTER.home=()=>{if($('#homeVol'))barChart($('#homeVol'),weeklyVolume(8),{h:210})};

/* ---------- train & library ---------- */
const LIB={q:'',m:'All'};
V.train=()=>{
  const sub=`<div class="chips"><button class="chip ${UI.trainTab==='workouts'?'on':''}" data-act="train-tab" data-v="workouts">${I('train')}Workouts & Routines</button><button class="chip ${UI.trainTab==='library'?'on':''}" data-act="train-tab" data-v="library">${I('lib')}Exercises (${EX.length})</button></div>`;
  if(UI.trainTab==='library')return`<div class="page-h"><div><h1>Train & Exercises</h1><p>${EX.length} movements with coaching cues and personal bests.</p></div><button class="btn primary" data-act="new-custom-ex">${I('plus')}Custom exercise</button></div>${sub}${renderLibraryBody()}`;
  const r=S.routines.map(x=>progCard(x,true)).join('');
  return`<div class="page-h"><div><h1>Train</h1><p>Pick a program, custom routine, or start from scratch.</p></div></div>
  ${sub}
  <section class="card quick"><div class="next" style="flex:1;min-width:220px"><div class="bigic">${I('plus')}</div><div class="txt"><b>Empty workout</b><div class="t2" style="font-size:13.5px">Add any strength, bodyweight or cardio exercise as you go</div></div></div>
    <button class="btn primary" data-act="start-empty">${I('play')}Start empty</button></section>
  <div class="page-h"><h2>My routines</h2></div>
  <section class="grid g3">${r}<button class="card add-card" data-act="new-routine">${I('plus')}Create routine</button></section>
  <div class="page-h"><h2>Programs</h2></div>
  <section class="grid g3">${PRESETS.map(p=>progCard(p,false)).join('')}</section>`;
};
V.library=()=>{UI.trainTab='library';return V.train()};
function renderLibraryBody(){
  return`<div class="search">${I('search')}<input id="libq" placeholder="Search exercises or equipment" value="${esc(LIB.q)}" data-inp="lib-q" autocomplete="off"></div>
  <div class="chips">${['All',...MUSCLES].map(m=>`<button class="chip ${m===LIB.m?'on':''}" data-act="lib-m" data-m="${m}">${m}</button>`).join('')}</div>
  <section class="lib" id="libgrid">${libGrid()}</section>`;
}
function libGrid(){
  const q=LIB.q.trim().toLowerCase();
  const list=EX.filter(e=>(LIB.m==='All'||e.m===LIB.m)&&(!q||(e.n+' '+e.eq+' '+e.m).toLowerCase().includes(q)));
  if(!list.length)return`<div class="chart-empty" style="grid-column:1/-1">No exercises match “${esc(LIB.q)}”.</div>`;
  return list.map(e=>{
    const b=bestOf(e.id);
    return`<button class="card exi" data-act="open-ex" data-id="${e.id}"><div class="mb">${MABBR[e.m]||'EX'}</div><div class="info"><b>${esc(e.n)}${e.custom?` <span class="badge acc" style="margin-left:4px">Custom</span>`:''}</b><small class="muted">${e.m} · ${esc(e.eq)}${b.v?` · <span class="acc">Best ${metricLabel(e.k,b.v)}</span>`:''}</small></div>${I('chev','chev')}</button>`;
  }).join('');
}
function progCard(p,custom){
  const n=(p.ex||[]).length,mins=Math.round(n*3*2.6/5)*5||10;
  const tag=custom?[...new Set((p.ex||[]).map(id=>EXM[id]?.m).filter(Boolean))].join(' · '):p.tag;
  return`<div class="card prog"><div class="ph"><div><h3>${esc(p.name)}</h3><div class="muted" style="font-size:13px;margin-top:3px">${esc(tag)}</div></div>
    ${custom?`<button class="icon-btn" aria-label="Delete routine" data-act="del-routine" data-id="${p.id}">${I('trash')}</button>`:''}</div>
    <ul>${(p.ex||[]).slice(0,6).map(id=>`<li>${esc(EXM[id]?.n||id)}</li>`).join('')}</ul>
    <div class="pf"><span class="muted" style="font-size:13px">${n} exercises · ~${mins} min</span><button class="btn sm primary" data-act="start-routine" data-id="${p.id}">${I('play')}Start</button></div></div>`;
}

/* ---------- track (daily tasks, water, meals, steps, custom goals) ---------- */
V.track=()=>{
  const dk=S.todayKey||dayKey(Date.now()),p=S.profile,log=getLog(dk),mac=mealMacros(log.meals||[]);
  const glassMl=Math.max(50,p.glassSizeMl||250),curGlasses=Math.floor((log.waterMl||0)/glassMl),tgtGlasses=Math.max(1,Math.ceil((p.dailyWaterMlTarget||2500)/glassMl));
  const mealTypes=['Breakfast','Lunch','Dinner','Snack'];
  const mealsByType=mealTypes.map(mt=>{
    const items=(log.meals||[]).filter(m=>m.mealType===mt);
    const subCal=items.reduce((a,m)=>a+(+m.calories||0),0),subPro=items.reduce((a,m)=>a+(+m.proteinGrams||0),0);
    return`<div class="card" style="padding:16px">
      <div class="card-h" style="margin-bottom:8px"><div><h3>${mt}</h3><small class="muted">${subCal} kcal · ${subPro}g protein</small></div>
        <button class="btn sm primary" data-act="open-add-meal" data-mt="${mt}">${I('plus')}Add</button></div>
      ${items.length?items.map(m=>`<div class="meal-row"><div><b>${esc(m.name)}</b><div class="muted" style="font-size:12.5px">${m.calories} kcal · ${m.proteinGrams}g P${m.carbsGrams?` · ${m.carbsGrams}g C`:''}${m.fatGrams?` · ${m.fatGrams}g F`:''}</div></div>
        <button class="icon-btn" aria-label="Delete meal" data-act="del-meal" data-id="${m.id}" data-dk="${dk}">${I('trash')}</button></div>`).join(''):`<div class="muted" style="font-size:13px">Nothing logged for ${mt.toLowerCase()} yet.</div>`}
    </div>`;
  }).join('');

  const customQuickMeals=(S.customMeals||[]).length?`<div class="row-in" style="margin-top:10px">${S.customMeals.slice(0,6).map(cm=>`<button class="chip" data-act="log-custom-meal" data-id="${cm.id}">${I('plus')}${esc(cm.name)} (${cm.calories} kcal)</button>`).join('')}</div>`:'';

  const goalsHtml=(S.goals||[]).length?(S.goals||[]).map(g=>{
    const st=goalWindowStats(g);
    const pct=Math.min(100,Math.round(st.completed/Math.max(1,st.totalDays)*100));
    return`<div class="card goal-card">
      <div class="card-h" style="margin-bottom:0">
        <div><h3>${esc(g.title)}</h3><small class="muted">${g.targetValue} ${esc(g.unitLabel)} daily · ${g.startDateKey} → ${g.endDateKey}</small></div>
        <div class="row-in" style="gap:4px">
          <span class="badge ${st.todayMet?'good':'miss'}">${st.todayMet?'Done Today':'Pending Today'}</span>
          <button class="icon-btn" aria-label="Edit goal" data-act="edit-goal" data-id="${g.id}">${I('edit')}</button>
          <button class="icon-btn" aria-label="Delete goal" data-act="del-goal" data-id="${g.id}">${I('trash')}</button>
        </div>
      </div>
      <div class="meta"><span>Completed: <b>${st.completed}</b> day(s)</span><span>Missed: <b>${st.missed}</b> day(s)</span><span>Window: ${st.totalDays} days</span></div>
      <div class="pbar ${st.todayMet?'good':''}"><i style="width:${pct}%"></i></div>
      <div class="row-in"><button class="btn sm ${st.todayMet?'':'primary'}" data-act="toggle-goal-today" data-id="${g.id}">${I('check')}${st.todayMet?'Marked Done Today':'Mark Complete Today'}</button></div>
    </div>`;
  }).join(''):`<div class="chart-empty">Create custom time-bound goals like “40 push-ups daily for 30 days”.</div>`;

  return`<div class="page-h"><div><h1>Daily Tracker</h1><p>${fmtDate(keyTs(dk),{weekday:'long',month:'long',day:'numeric'})} · Auto-saved to cloud</p></div></div>

  <section class="grid g2">
    <div class="card">
      <div class="card-h"><div><h2>Daily Exercises & Steps</h2><div class="sub">Bodyweight & cardio targets</div></div></div>
      <div class="kv">
        <div><b>Push-ups</b><br><small class="muted">${log.pushUps||0} / ${p.dailyPushUpsTarget||40} reps (${Math.max(0,(p.dailyPushUpsTarget||40)-(log.pushUps||0))} left)</small></div>
        <div class="row-in"><button class="btn sm primary" data-act="quick-pushup" data-n="10">+10</button><button class="btn sm" data-act="quick-pushup" data-n="20">+20</button><button class="btn sm" data-act="set-metric" data-k="pushUps">Edit</button></div>
      </div>
      <div class="kv">
        <div><b>Squats</b><br><small class="muted">${log.squats||0} / ${p.dailySquatsTarget||50} reps (${Math.max(0,(p.dailySquatsTarget||50)-(log.squats||0))} left)</small></div>
        <div class="row-in"><button class="btn sm primary" data-act="quick-squat" data-n="10">+10</button><button class="btn sm" data-act="quick-squat" data-n="25">+25</button><button class="btn sm" data-act="set-metric" data-k="squats">Edit</button></div>
      </div>
      <div class="kv">
        <div><b>Steps</b><br><small class="muted">${(log.steps||0).toLocaleString()} / ${(p.dailyStepsTarget||8000).toLocaleString()} steps</small></div>
        <div class="row-in"><button class="btn sm" data-act="hc-sync">${I('heart')}HC Sync</button><button class="btn sm" data-act="set-metric" data-k="steps">Edit</button></div>
      </div>
      <div class="kv">
        <div><b>Active workout minutes</b><br><small class="muted">${log.workoutMinutes||0} / ${p.dailyWorkoutMinutesTarget||45} min</small></div>
        <div class="row-in"><button class="btn sm" data-act="add-activity">${I('plus')}Log activity</button></div>
      </div>
      ${(log.otherActivities||[]).length?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${log.otherActivities.map(a=>`<span class="pill">${esc(a.name)} · ${a.minutes}m</span>`).join('')}</div>`:''}
    </div>

    <div class="card">
      <div class="card-h"><div><h2>Water Hydration</h2><div class="sub">${((log.waterMl||0)/1000).toFixed(2)} L / ${((p.dailyWaterMlTarget||2500)/1000).toFixed(2)} L</div></div><span class="pill acc">${curGlasses}/${tgtGlasses} glasses</span></div>
      <div class="pbar"><i style="width:${Math.min(100,(log.waterMl||0)/Math.max(1,p.dailyWaterMlTarget||2500)*100)}%"></i></div>
      <div class="water-cups">${[...Array(Math.min(16,Math.max(tgtGlasses,curGlasses)))].map((_,i)=>`<button class="cup ${i<curGlasses?'on':''}" data-act="set-water-glasses" data-g="${i+1}" aria-label="${i+1} glasses">${i+1}</button>`).join('')}</div>
      <div class="row-in" style="margin-top:14px">
        <button class="btn sm primary" data-act="quick-water" data-n="1">${I('plus')}1 glass (${glassMl}ml)</button>
        <button class="btn sm" data-act="quick-water-ml" data-ml="500">+500 ml</button>
        <button class="btn sm" data-act="quick-water" data-n="-1">-1 glass</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><div><h2>Meals & Nutrition</h2><div class="sub">${mac.calories} / ${p.dailyCaloriesTarget||2200} kcal · ${mac.protein} / ${p.dailyProteinTarget||140}g protein</div></div>
      <button class="btn sm" data-act="open-add-meal" data-mt="Lunch">${I('plus')}Custom Meal</button>
    </div>
    <div class="grid g2">
      <div><small class="muted">Calories (${Math.max(0,(p.dailyCaloriesTarget||2200)-mac.calories)} kcal remaining)</small><div class="pbar"><i style="width:${Math.min(100,mac.calories/Math.max(1,p.dailyCaloriesTarget||2200)*100)}%"></i></div></div>
      <div><small class="muted">Protein (${Math.max(0,(p.dailyProteinTarget||140)-mac.protein)}g remaining)</small><div class="pbar good"><i style="width:${Math.min(100,mac.protein/Math.max(1,p.dailyProteinTarget||140)*100)}%"></i></div></div>
    </div>
    ${customQuickMeals}
    <div class="grid g2" style="margin-top:14px">${mealsByType}</div>
  </section>

  <section class="card">
    <div class="card-h"><div><h2>Custom Goals & Daily Tasks</h2><div class="sub">Start & target end date tracking (completed vs. missed)</div></div>
      <button class="btn sm primary" data-act="new-goal">${I('plus')}New Goal</button>
    </div>
    <div class="grid g2">${goalsHtml}</div>
  </section>`;
};

/* ---------- history & complete analytics ---------- */
V.progress=()=>{UI.histTab='analytics';return V.history()};

const PROG={ex:''};
function strengthOptions(){const c={};S.workouts.forEach(w=>(w.ex||[]).forEach(e=>{if(EXM[e.id]?.k==='weight'&&(e.sets||[]).some(s=>s.w>0&&s.r>0))c[e.id]=(c[e.id]||0)+1}));return Object.keys(c).sort((a,b)=>c[b]-c[a])}

function renderAnalyticsSection(){
  const periods=[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly'],['all','All-Time']];
  const agg=aggregatePeriod(UI.period);
  const opts=strengthOptions();if(!opts.includes(PROG.ex))PROG.ex=opts[0]||'';
  const achs=computeAchievements();

  return`
  <div class="chips">${periods.map(([k,l])=>`<button class="chip ${UI.period===k?'on':''}" data-act="period" data-v="${k}">${l}</button>`).join('')}</div>
  <section class="grid g4">
    <div class="card stat"><div class="lab">${I('flame')}Push-ups</div><div class="val">${fmtBig(agg.pushUps)}<small>reps</small></div></div>
    <div class="card stat"><div class="lab">${I('bolt')}Squats</div><div class="val">${fmtBig(agg.squats)}<small>reps</small></div></div>
    <div class="card stat"><div class="lab">${I('train')}Workouts</div><div class="val">${agg.workouts}<small>${agg.hours}h · ${agg.totalExercises} ex</small></div></div>
    <div class="card stat"><div class="lab">${I('drop')}Water</div><div class="val">${agg.waterLiters.toFixed(1)}<small>L · ${agg.waterGlasses} gl</small></div></div>
    <div class="card stat"><div class="lab">${I('utensils')}Meals & Kcal</div><div class="val">${fmtBig(agg.calories)}<small>kcal · ${agg.meals} meals</small></div></div>
    <div class="card stat"><div class="lab">${I('layers')}Protein</div><div class="val">${fmtBig(agg.protein)}<small>g</small></div></div>
    <div class="card stat"><div class="lab">${I('heart')}Steps</div><div class="val">${fmtBig(agg.steps)}<small>steps</small></div></div>
    <div class="card stat"><div class="lab">${I('target')}Goal Score</div><div class="val">${agg.goalCompletionPct}%<small>${agg.weightDelta!=null?(agg.weightDelta>0?'+':'')+fmtN(toD(agg.weightDelta))+' '+U():'avg daily'}</small></div></div>
  </section>

  <section class="card"><div class="card-h"><h2>Consistency</h2><span class="sub">Last 20 weeks · minutes per day</span></div>${heatmap(20)}</section>

  <section class="card"><div class="card-h"><div><h2>Strength progress</h2><div class="sub" style="margin-top:3px">Estimated 1-rep max per session</div></div>
    ${opts.length?`<select class="field" data-chg="prog-ex" aria-label="Exercise">${opts.map(id=>`<option value="${id}" ${id===PROG.ex?'selected':''}>${esc(EXM[id]?.n||id)}</option>`).join('')}</select>`:''}</div>
    <div class="chart" id="strChart"></div><div id="strTbl"></div></section>

  <section class="grid g2">
    <div class="card"><div class="card-h"><h2>Weekly volume</h2><span class="sub">Last 12 weeks · ${U()}</span></div><div class="chart" id="volChart"></div></div>
    <div class="card"><div class="card-h"><h2>Muscle balance</h2><span class="sub">Sets · last 30 days</span></div>${muscleBars()}</div>
  </section>

  ${bwCard()}

  <section class="card"><div class="card-h"><h2>Achievements</h2><span class="sub">${achs.filter(a=>a.on).length}/${achs.length} unlocked</span></div>
    <div class="ach-grid">${achs.map(a=>`<div class="ach ${a.on?'on':''}"><div class="ic-box">${I(a.ic)}</div><div><b>${esc(a.t)}</b><div class="muted" style="font-size:12.5px;margin-top:2px">${esc(a.d)}</div></div></div>`).join('')}</div>
  </section>

  <section class="card"><div class="card-h"><h2>Personal records</h2><span class="sub">All-time bests</span></div>${prList()}</section>`;
}

function computeAchievements(){
  const all=aggregatePeriod('all');
  const maxWater=Math.max(0,...S.dailyLogs.map(l=>l.waterMl||0));
  return[
    {ic:'bolt',t:'First Forge',d:'Complete 1 workout',on:all.workouts>=1},
    {ic:'flame',t:'100 Push-Ups',d:'100 lifetime push-ups',on:all.pushUps>=100},
    {ic:'flame',t:'1,000 Push-Ups Club',d:'1,000 lifetime push-ups',on:all.pushUps>=1000},
    {ic:'trophy',t:'Consistency Beast',d:'10+ workouts logged',on:all.workouts>=10},
    {ic:'drop',t:'Hydration Pro',d:'Hit daily water target (2L+)',on:maxWater>=2000},
    {ic:'utensils',t:'Macro Tracker',d:'Log 10+ meals',on:all.meals>=10}
  ];
}

function renderCalendarSection(){
  const [yr,mo]=(UI.calMonth||monthKey(S.todayKey)).split('-').map(Number);
  const first=new Date(yr,mo-1,1);
  const offset=(first.getDay()+6)%7;
  const daysInMonth=new Date(yr,mo,0).getDate();
  const title=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const woDays=new Set(S.workouts.map(w=>w.dateKey||dayKey(w.start)));
  const logMap=Object.fromEntries(S.dailyLogs.map(l=>[l.dateKey,l]));

  let cells='';
  for(let i=0;i<offset;i++)cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dk=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasW=woDays.has(dk),l=logMap[dk];
    const hasD=!!(l&&((l.pushUps||0)>0||(l.squats||0)>0||(l.waterMl||0)>0||(l.meals||[]).length>0||(l.steps||0)>0));
    cells+=`<button class="cal-day ${dk===S.todayKey?'today':''} ${dk===UI.selDate?'sel':''}" data-act="cal-sel" data-dk="${dk}">
      <span>${d}</span><span class="cal-dots">${hasW?'<i class="w"></i>':''}${hasD?'<i class="d"></i>':''}</span></button>`;
  }

  const sd=UI.selDate||S.todayKey;
  const log=getLog(sd),mac=mealMacros(log.meals||[]);
  const dayWos=S.workouts.filter(w=>(w.dateKey||dayKey(w.start))===sd);
  const dayMeas=S.weights.find(x=>x.d===sd);

  return`<section class="grid g2">
    <div class="card">
      <div class="card-h">
        <button class="icon-btn" data-act="cal-nav" data-d="-1" aria-label="Previous month" style="transform:rotate(180deg)">${I('chev')}</button>
        <h3>${title}</h3>
        <button class="icon-btn" data-act="cal-nav" data-d="1" aria-label="Next month">${I('chev')}</button>
      </div>
      <div class="cal-grid">
        ${['M','T','W','T','F','S','S'].map(x=>`<div class="cal-wd">${x}</div>`).join('')}
        ${cells}
      </div>
      <div class="row-in muted" style="margin-top:12px;font-size:12px"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-text);margin-right:4px"></span>Workout</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:4px"></span>Daily Activity</span></div>
    </div>

    <div class="card">
      <div class="card-h">
        <div><h3>${fmtDate(keyTs(sd),{weekday:'long',month:'short',day:'numeric',year:'numeric'})}</h3><small class="muted">Edit any historical entry accurately</small></div>
        <button class="btn sm primary" data-act="edit-day" data-dk="${sd}">${I('edit')}Edit Day</button>
      </div>
      <div class="kv"><span>Push-ups</span><b>${log.pushUps||0} reps</b></div>
      <div class="kv"><span>Squats</span><b>${log.squats||0} reps</b></div>
      <div class="kv"><span>Water</span><b>${((log.waterMl||0)/1000).toFixed(2)} L (${log.waterMl||0} ml)</b></div>
      <div class="kv"><span>Meals & Macros</span><b>${mac.count} meals · ${mac.calories} kcal · ${mac.protein}g P</b></div>
      <div class="kv"><span>Steps & Workout min</span><b>${(log.steps||0).toLocaleString()} steps · ${log.workoutMinutes||0}m</b></div>
      ${dayMeas?`<div class="kv"><span>Body weight</span><b>${fmtW(dayMeas.kg)} ${U()}${dayMeas.waistCm?` · Waist ${dayMeas.waistCm}cm`:''}</b></div>`:''}
      ${log.notes?`<div class="hx" style="margin-top:10px"><small class="muted">Notes</small><div style="margin-top:4px">${esc(log.notes)}</div></div>`:''}
      ${dayWos.length?`<div style="margin-top:12px"><h3 style="margin-bottom:6px">Workouts on this date</h3>${dayWos.map(woRow).join('')}</div>`:''}
    </div>
  </section>`;
}

function renderWorkoutHistorySection(){
  if(!S.workouts.length)return`<div class="card empty"><div class="bigic">${I('hist')}</div><h2>No workouts yet</h2><p class="t2">Finished workouts are saved here with every set.</p><a class="btn primary" href="#train">${I('play')}Start training</a></div>`;
  let html='';let lastM='';
  S.workouts.forEach(w=>{
    const m=fmtDate(w.start,{month:'long',year:'numeric'});if(m!==lastM){html+=`<div class="month">${m}</div>`;lastM=m}
    html+=`<details class="card hist"><summary>${woRow(w)}</summary><div class="hist-body">
      <div class="muted" style="font-size:13px">${fmtDate(w.start,{weekday:'long',month:'long',day:'numeric'})} · ${new Date(w.start).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>
      ${(w.ex||[]).map(e=>{const ex=EXM[e.id];const prs=(w.prs||[]).filter(p=>p.id===e.id);return`<div class="hx"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>${esc(ex?ex.n:e.id)}</b>${prs.length?`<span class="pr-tag">${I('trophy')}PR</span>`:''}</div><div class="sets">${(e.sets||[]).map((s,i)=>`<span>${i+1}. ${setLabel(ex?ex.k:'weight',s)}</span>`).join('')}</div></div>`}).join('')}
      <div class="row-in"><button class="btn sm" data-act="repeat" data-id="${w.id}">${I('repeat')}Repeat workout</button><button class="btn sm danger" data-act="del-wo" data-id="${w.id}">${I('trash')}Delete</button></div>
    </div></details>`;
  });
  return html;
}

const aiPend={};
window.__FORGE_ON_AI_RESULT=function(kind,payloadRaw){
  AI_STATE.busy=false;
  try{
    const p=typeof payloadRaw==='string'?JSON.parse(payloadRaw):payloadRaw;
    AI_STATE.source=p.source||'offline';
    if(kind==='chat'){AI_STATE.messages.push({role:'ai',text:p.text||'Keep moving!'});}
    else if(kind==='workout'){AI_STATE.workoutPlan=p.plan;}
    else if(kind==='diet'){AI_STATE.dietPlan=p.diet;}
    else if(kind==='analysis'){AI_STATE.analysis=p.analysis;}
    if(currentView()==='coach')renderMain();
  }catch(e){console.error(e);if(currentView()==='coach')renderMain()}
};

/* ---------- charts & heatmap & measurements ---------- */
let gid=0;
function niceTicks(min,max,count=4){if(min===max){min-=1;max+=1}const step0=(max-min)/count,mag=Math.pow(10,Math.floor(Math.log10(step0))),e=step0/mag;
  const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(8));return{lo,hi,ticks:t}}
function xLabelIdx(n,max=6){if(n<=max)return[...Array(n).keys()];const out=[];for(let i=0;i<max;i++)out.push(Math.round(i*(n-1)/(max-1)));return out}
function lineChart(el,pts,o={}){
  if(!pts.length){el.innerHTML=`<div class="chart-empty">${o.empty||'No data yet'}</div>`;return}
  const W=Math.max(260,el.clientWidth),H=o.h||210,Pd={l:44,r:14,t:14,b:28},iw=W-Pd.l-Pd.r,ih=H-Pd.t-Pd.b;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);const pad=(mx-mn)*.2||Math.max(1,mx*.04);
  const{lo,hi,ticks}=niceTicks(Math.max(0,mn-pad),mx+pad);
  const X=i=>Pd.l+(pts.length===1?iw/2:i*iw/(pts.length-1)),Y=v=>Pd.t+ih-(v-lo)/(hi-lo)*ih;const id='g'+(++gid);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join('');
  const area=line+`L${X(pts.length-1).toFixed(1)},${Pd.t+ih}L${X(0).toFixed(1)},${Pd.t+ih}Z`;
  const li=pts.length-1;
  el.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="Line chart">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart)" stop-opacity=".22"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="grid-l" x1="${Pd.l}" x2="${W-Pd.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${Pd.l-8}" y="${Y(t)+4}" text-anchor="end">${o.fmt?o.fmt(t):t}</text>`).join('')}
    ${xLabelIdx(pts.length,Math.max(2,Math.floor(iw/80))).map(i=>`<text class="tick" x="${X(i)}" y="${H-6}" text-anchor="${pts.length===1?'middle':i===0?'start':i===li?'end':'middle'}">${esc(pts[i].x)}</text>`).join('')}
    ${pts.length>1?`<path d="${area}" fill="url(#${id})"/>`:''}
    <path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length<=24?pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===li?4.5:3}" fill="${i===li?'var(--chart)':'var(--surface)'}" stroke="${i===li?'var(--surface)':'var(--chart)'}" stroke-width="2"/>`).join(''):`<circle cx="${X(li)}" cy="${Y(pts[li].y)}" r="4.5" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>`}
    <line class="xhair" y1="${Pd.t}" y2="${Pd.t+ih}" visibility="hidden"/><circle class="hdot" r="5.5" fill="var(--chart)" stroke="var(--surface)" stroke-width="2.5" visibility="hidden"/>
    <rect x="${Pd.l-10}" y="0" width="${iw+20}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),xh=svg.querySelector('.xhair'),hd=svg.querySelector('.hdot'),tip=el.querySelector('.tip');
  const move=ev=>{const r=svg.getBoundingClientRect();const x=ev.clientX-r.left;let i=pts.length===1?0:Math.round((x-Pd.l)/iw*(pts.length-1));i=Math.max(0,Math.min(li,i));
    const cx=X(i),cy=Y(pts[i].y);xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('visibility','visible');hd.setAttribute('cx',cx);hd.setAttribute('cy',cy);hd.setAttribute('visibility','visible');
    tip.innerHTML=pts[i].t;tip.style.left=Math.max(70,Math.min(W-70,cx))+'px';tip.style.top=cy+'px';tip.classList.add('show')};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{xh.setAttribute('visibility','hidden');hd.setAttribute('visibility','hidden');tip.classList.remove('show')});
}
function barChart(el,data,o={}){
  const W=Math.max(260,el.clientWidth),H=o.h||210,Pd={l:44,r:8,t:14,b:28},iw=W-Pd.l-Pd.r,ih=H-Pd.t-Pd.b;
  const max=Math.max(...data.map(d=>d.v));
  if(!max){el.innerHTML=`<div class="chart-empty">Volume appears here once you log weighted sets.</div>`;return}
  const{hi,ticks}=niceTicks(0,max,4);const band=iw/data.length,bw=Math.min(30,band*.6),base=Pd.t+ih;const Y=v=>base-v/hi*ih;
  const bars=data.map((d,i)=>{if(!d.v)return'';const x=Pd.l+i*band+(band-bw)/2,y=Y(d.v),h=base-y,r=Math.min(4,bw/2,h);
    return`<path class="bar" data-i="${i}" d="M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${base}Z" fill="var(--chart)"/>`}).join('');
  const lab=xLabelIdx(data.length,Math.max(2,Math.floor(iw/62)));
  el.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="Bar chart">
    ${ticks.map(t=>`<line class="grid-l" x1="${Pd.l}" x2="${W-Pd.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${Pd.l-8}" y="${Y(t)+4}" text-anchor="end">${fmtBig(t)}</text>`).join('')}
    ${lab.map(i=>`<text class="tick" x="${Pd.l+i*band+band/2}" y="${H-6}" text-anchor="middle">${esc(data[i].label)}</text>`).join('')}
    <g class="bars">${bars}</g>${data.map((d,i)=>`<rect class="hit" data-i="${i}" x="${Pd.l+i*band}" y="${Pd.t}" width="${band}" height="${ih}" fill="transparent"/>`).join('')}</svg><div class="tip"></div>`;
  const tip=el.querySelector('.tip'),svg=el.querySelector('svg');
  svg.querySelectorAll('.hit').forEach(h=>{const i=+h.dataset.i;const on=()=>{svg.querySelectorAll('.bar').forEach(b=>b.style.opacity=+b.dataset.i===i?1:.4);
      tip.innerHTML=data[i].t;tip.style.left=Math.max(70,Math.min(W-70,Pd.l+i*band+band/2))+'px';tip.style.top=(data[i].v?Y(data[i].v):base)+'px';tip.classList.add('show')};
    h.addEventListener('pointerenter',on);h.addEventListener('pointerdown',on)});
  svg.addEventListener('pointerleave',()=>{svg.querySelectorAll('.bar').forEach(b=>b.style.opacity=1);tip.classList.remove('show')});
}
function drawStrength(){
  const el=$('#strChart');if(!el)return;
  if(!PROG.ex){el.innerHTML=`<div class="chart-empty">Log a weighted exercise to see your strength curve.</div>`;return}
  const pts=[];[...S.workouts].reverse().forEach(w=>{const e=(w.ex||[]).find(x=>x.id===PROG.ex);if(!e)return;let best=0,bs=null;(e.sets||[]).forEach(s=>{const v=metric('weight',s);if(v>best){best=v;bs=s}});
    if(best)pts.push({x:fmtDate(w.start),y:toD(best),t:`<b>${fmtDate(w.start,{month:'short',day:'numeric',year:'numeric'})}</b><br>Est. 1RM ${fmtN(toD(best))} ${U()}<br><span style="opacity:.7">Best set ${setLabel('weight',bs)}</span>`,raw:{date:w.start,best,bs}})});
  lineChart(el,pts,{h:220,fmt:v=>fmtN(v),empty:'No sets logged yet'});
  $('#strTbl').innerHTML=pts.length?`<details class="tbl"><summary>View as table</summary><table><tr><th>Date</th><th>Best set</th><th>Est. 1RM (${U()})</th></tr>${pts.slice().reverse().map(p=>`<tr><td>${fmtDate(p.raw.date,{month:'short',day:'numeric',year:'numeric'})}</td><td>${setLabel('weight',p.raw.bs)}</td><td>${fmtN(p.y)}</td></tr>`).join('')}</table></details>`:'';
}
function weeklyVolume(n){
  const ws=weekStart(Date.now());const out=[];
  for(let i=n-1;i>=0;i--){const s=weekStart(addDays(ws,-7*i)),e=addDays(s,7);const list=S.workouts.filter(w=>w.start>=s&&w.start<e);const v=toD(list.reduce((a,w)=>a+w.vol,0));
    out.push({label:fmtDate(s),v,t:`<b>Week of ${fmtDate(s)}</b><br>${fmtBig(v)} ${U()} · ${list.length} workout${list.length===1?'':'s'}`})}
  return out;
}
function heatmap(weeks){
  const now=Date.now(),start=weekStart(addDays(weekStart(now),-7*(weeks-1)));const mins={};
  S.workouts.forEach(w=>{const k=w.dateKey||dayKey(w.start);mins[k]=(mins[k]||0)+w.dur/60});
  let cells='';
  for(let wi=0;wi<weeks;wi++){for(let d=0;d<7;d++){const t=addDays(start,wi*7+d);const k=dayKey(t);const m=mins[k]||0;
    const fut=t>now;const l=fut?'fut':m<=0?'':m<30?'l1':m<60?'l2':m<90?'l3':'l4';
    cells+=`<i class="${l}" ${fut?'':`data-tip="${fmtDate(t,{weekday:'short',month:'short',day:'numeric'})} · ${m?Math.round(m)+' min':'rest day'}"`}></i>`}}
  return`<div class="hm-wrap"><div class="hm-days"><span></span><span>Tue</span><span></span><span>Thu</span><span></span><span>Sat</span><span></span></div><div class="hm" role="img" aria-label="Training minutes per day">${cells}</div></div>
  <div class="legend-scale">Rest <i style="background:var(--surface2)"></i><i style="background:color-mix(in oklab,var(--chart) 30%,var(--surface2))"></i><i style="background:color-mix(in oklab,var(--chart) 55%,var(--surface2))"></i><i style="background:color-mix(in oklab,var(--chart) 78%,var(--surface2))"></i><i style="background:var(--chart)"></i> 90+ min</div>`;
}
function muscleBars(){
  const since=Date.now()-30*DAY,c={};MUSCLES.forEach(m=>c[m]=0);
  S.workouts.filter(w=>w.start>=since).forEach(w=>(w.ex||[]).forEach(e=>{const m=EXM[e.id]?.m;if(m)c[m]=(c[m]||0)+(e.sets||[]).length}));
  const max=Math.max(1,...Object.values(c));
  if(Object.values(c).every(v=>!v))return`<div class="chart-empty">No sets in the last 30 days.</div>`;
  return`<div class="hbars">${MUSCLES.map(m=>`<div class="hbar"><span class="n">${m}</span><div class="tr"><div class="fill" style="width:${c[m]/max*100}%"></div></div><span class="v">${c[m]}</span></div>`).join('')}</div>`;
}
function prList(){
  const items=[];EX.forEach(e=>{const b=bestOf(e.id);if(b.v)items.push({e,b})});
  if(!items.length)return`<div class="chart-empty">Records appear as you log sets.</div>`;
  items.sort((a,b)=>b.b.at-a.b.at);
  return`<div class="pr-list">${items.map(({e,b})=>`<button class="pr" data-act="open-ex" data-id="${e.id}" style="text-align:left"><span class="muted" style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">${metricName[e.k]}</span><span class="pv">${metricLabel(e.k,b.v)}</span><span class="pn">${esc(e.n)}</span><small class="muted">${e.k==='weight'?'Best set '+setLabel('weight',b.set)+' · ':''}${fmtDate(b.at,{month:'short',day:'numeric',year:'numeric'})}</small></button>`).join('')}</div>`;
}
function bwCard(){
  const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);const last=w[w.length-1];const first=w[0];
  const diff=last&&first&&w.length>1?toD(last.kg)-toD(first.kg):null;
  return`<section class="card"><div class="card-h"><div><h2>Weight & Body Measurements</h2><div class="sub" style="margin-top:3px">${last?`Latest ${fmtW(last.kg)} ${U()}${last.waistCm?` · Waist ${last.waistCm}cm`:''}${last.bodyFatPct?` · ${last.bodyFatPct}% BF`:''}${diff!=null?` · ${diff>0?'+':diff<0?'−':''}${fmtN(Math.abs(diff))} ${U()}`:''}`:'Log your weight & body measurements'}</div></div>
    <div class="row-in"><div class="unit-in"><input id="bwIn" inputmode="decimal" placeholder="${last?fmtW(last.kg):'Weight'}" aria-label="Body weight"><span>${U()}</span></div><button class="btn primary" data-act="log-bw">${I('plus')}Log</button><button class="btn" data-act="open-meas">${I('scale')}Full</button></div></div>
    <div class="chart" id="bwChart"></div>
    ${w.length?`<details class="tbl"><summary>View measurement entries (${w.length})</summary><table><tr><th>Date</th><th>Weight</th><th>Body Details</th><th></th></tr>${w.slice().reverse().slice(0,60).map(x=>`<tr><td>${fmtDate(keyTs(x.d),{month:'short',day:'numeric',year:'numeric'})}</td><td>${fmtW(x.kg)} ${U()}</td><td>${[x.bodyFatPct?x.bodyFatPct+'% BF':'',x.waistCm?'Waist '+x.waistCm+'cm':'',x.chestCm?'Chest '+x.chestCm+'cm':'',x.armCm?'Arm '+x.armCm+'cm':''].filter(Boolean).join(' · ')||'—'}</td><td style="text-align:right"><button class="link" data-act="del-bw" data-d="${x.d}" style="color:var(--muted)">Remove</button></td></tr>`).join('')}</table></details>`:''}

function drawBW(){
